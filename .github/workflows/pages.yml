name: Website

# Builds the website's data files from the plays and publishes the site to GitHub Pages.
# Runs when the site or its builder changes, when the daily refresh adds new plays, and by hand.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/site.rs"
      - "src/pages.rs"
      - "src/derive.rs"
      - ".github/workflows/pages.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer one waits rather than cancelling a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the site script parses
        run: node --check site/assets/app.js

      - name: Build the data files
        run: |
          cargo build --release --locked
          ./target/release/bbc6 site --data data --src site --out public \
            --origin "https://${{ github.repository_owner }}.github.io" \
            --base "/${{ github.event.repository.name }}/"
        env:
          # Optional: set these repository variables to prove ownership to Google / Bing.
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      - name: Copy search-engine verification files and the IndexNow key into the site
        run: cp site/google*.html site/BingSiteAuth.xml site/*.txt public/ 2>/dev/null || true

      - name: Make sure no email address slipped into the site
        run: |
          python3 - <<'PY'
          import glob, re, sys
          pat = re.compile(rb"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}")
          bad = [p for p in glob.glob("public/**/*.*", recursive=True) if pat.search(open(p, "rb").read())]
          print("files with an email address:", bad)
          sys.exit(1 if bad else 0)
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4

      # Tell Bing and other IndexNow search engines about the pages. When the site itself changed
      # every page is sent; on the daily refresh only the pages that change every day.
      - name: Tell IndexNow search engines
        continue-on-error: true
        run: |
          sleep 60   # let the new key file reach the web first
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then mode=all; else mode=fresh; fi
          python3 .github/scripts/indexnow.py public/sitemap.xml "$mode"
